<div class="tracker-container">

    <!-- Login Form -->
    <div id="login-section">
        <h2>Employee Login</h2>

        <input type="text" id="username" placeholder="Username" required>
        <br><br>

        <input type="password" id="password" placeholder="Password" required>
        <br><br>

        <button onclick="login()">Login</button>

        <div id="login-message" style="color:red; margin-top:10px;"></div>
    </div>

    <!-- Tracking Section -->
    <div id="tracking-section" style="display:none;">

        <button id="start-btn" onclick="startTracking()">
            ▶ Start Tracking
        </button>

        <button id="stop-btn" onclick="stopTracking()" style="display:none;">
            ⏹ Stop Tracking
        </button>

        <div id="status"></div>

        <iframe
            id="mapFrame"
            width="100%"
            height="400"
            style="display:none; margin-top:20px; border-radius:10px;"
            frameborder="0">
        </iframe>

    </div>

</div>

<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // Demo credentials
    if (username === "employee" && password === "12345") {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("tracking-section").style.display = "block";
    } else {
        document.getElementById("login-message").innerHTML =
            "Invalid username or password";
    }
}

// Your existing tracking functions
function startTracking() {
    document.getElementById("status").innerHTML =
        "Tracking Started...";
}

function stopTracking() {
    document.getElementById("status").innerHTML =
        "Tracking Stopped";
}
</script>
<div class="tracker-container">

    <button id="start-btn" onclick="startTracking()">
        ▶ Start Tracking
    </button>

    <button id="stop-btn" onclick="stopTracking()" style="display:none;">
        ⏹ Stop Tracking
    </button>

    <div id="status"></div>

    <iframe
        id="mapFrame"
        width="100%"
        height="400"
        style="display:none; margin-top:20px; border-radius:10px;"
        frameborder="0">
    </iframe>

</div>
<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "employee" && password === "12345") {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("tracking-section").style.display = "block";
    } else {
        document.getElementById("login-message").innerHTML =
            "Invalid login";
    }
}

function startTracking() {
    document.getElementById("status").innerHTML = "Tracking started...";

    navigator.geolocation.watchPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        console.log("Location:", lat, lon);

        document.getElementById("status").innerHTML =
            "Lat: " + lat + " | Lon: " + lon;
    });
}

function stopTracking() {
    document.getElementById("status").innerHTML = "Tracking stopped";
}
</script>
